<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ML-KEM / ML-DSA benchmark</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1 data-i18n="title"></h1>
      <div class="tools">
        <button id="lang" type="button"></button
        ><button id="theme" type="button"></button>
      </div>
    </header>
    <main>
      <p class="lead" data-i18n="sub"></p>
      <div class="ctrl">
        <div class="seg" role="group">
          <button type="button" data-g="kem" data-i18n="kem"></button>
          <button type="button" data-g="sig" data-i18n="sig"></button>
        </div>
        <label class="chk"
          ><input type="checkbox" id="log" checked /><span
            data-i18n="log"
          ></span
        ></label>
        <label class="file"
          ><span data-i18n="load"></span
          ><input type="file" id="file" accept=".json"
        /></label>
      </div>
      <section id="empty" hidden>
        <h2 data-i18n="empty_h"></h2>
        <p data-i18n="empty_p"></p>
        <pre><code>npm run bench</code></pre>
      </section>
      <div id="content" hidden></div>
    </main>
    <script src="data/results.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
